name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE: ghcr.io/karchtho/portfolio-v2/frontend
  BACKEND_IMAGE: ghcr.io/karchtho/portfolio-v2/backend

jobs:
  # ============================================
  # BUILD (parallel)
  # ============================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # DEPLOY (after both builds)
  # ============================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    environment:
      name: production
      url: https://karcherthomas.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 400 /tmp/ssh_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: |
          ssh -i /tmp/ssh_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/portfolio-v2"

      - name: Copy docker-compose to server
        run: |
          scp -i /tmp/ssh_key -P ${{ secrets.SSH_PORT }} \
            docker-compose.prod.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/portfolio-v2/docker-compose.yml

      - name: Generate .env on server
        run: |
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" > /tmp/portfolio.env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> /tmp/portfolio.env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> /tmp/portfolio.env
          echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}" >> /tmp/portfolio.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /tmp/portfolio.env
          echo "NODE_ENV=production" >> /tmp/portfolio.env
          echo "PORT=3000" >> /tmp/portfolio.env
          echo "API_URL=https://karcherthomas.com" >> /tmp/portfolio.env
          echo "ENVIRONMENT=production" >> /tmp/portfolio.env
          scp -i /tmp/ssh_key -P ${{ secrets.SSH_PORT }} /tmp/portfolio.env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/portfolio-v2/.env

      - name: Deploy
        run: |
          ssh -i /tmp/ssh_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
            cd /opt/portfolio-v2 && \
            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
            docker compose pull && \
            docker compose up -d --force-recreate --remove-orphans && \
            docker image prune -f"

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/ssh_key

      - name: Verify deployment
        run: |
          sleep 15
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://karcherthomas.com)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Site is accessible (HTTP $HTTP_STATUS)"
          else
            echo "Site returned HTTP $HTTP_STATUS"
            exit 1
          fi

          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://karcherthomas.com/api/health)
          if [ "$API_STATUS" -eq 200 ]; then
            echo "API is healthy (HTTP $API_STATUS)"
          else
            echo "API health check failed (HTTP $API_STATUS)"
            exit 1
          fi
